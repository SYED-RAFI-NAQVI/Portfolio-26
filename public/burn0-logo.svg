<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="burn0">
  <!-- burn0 mark: the accent 0 alone, as it appears in the wordmark and the card
       artwork. Slashed, because the wordmark is set in Geist Mono and its zero is.
       Drawn as geometry rather than <text> so it renders identically without
       depending on the font being present. Oval, not circular — monospace zeros
       are narrow. Palette from globals.css: #09090B ground, #FF4500 accent. -->
  <rect width="64" height="64" rx="13" fill="#09090B"/>
  <g fill="none" stroke="#FF4500" stroke-width="7.5">
    <ellipse cx="32" cy="32" rx="12.5" ry="17"/>
    <line x1="25" y1="41.5" x2="39" y2="22.5" stroke-width="6.5" stroke-linecap="round"/>
  </g>
</svg>
